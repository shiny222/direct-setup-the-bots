name: telegram-bridges

x-bot: &bot
  init: true
  restart: unless-stopped
  working_dir: /tmp
  environment:
    LOCAL_API_HOST: telegram-api
  depends_on:
    telegram-api:
      condition: service_healthy

services:
  telegram-api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
      additional_contexts:
        source: ${API_SOURCE:-./sources/telegram-bot-api}
    init: true
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
    command:
      - --local
      - --http-ip-address=0.0.0.0
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
      - --temp-dir=/var/lib/telegram-bot-api
    volumes:
      - api-data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "bash", "-c", "true >/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 20

  rubika:
    <<: *bot
    profiles: [rubika, both, all]
    build:
      context: .
      dockerfile: Dockerfile.bot
      args:
        BOT_ENTRY: bridge.py
      additional_contexts:
        source: ${RUBIKA_SOURCE:-./sources/telegram-to-rubika}
    volumes:
      - api-data:/var/lib/telegram-bot-api:ro
      - type: bind
        source: ./config/rubika.json
        target: /run/bridge/config.json
        read_only: true
        bind:
          create_host_path: false

  bale:
    <<: *bot
    profiles: [bale, both, all]
    build:
      context: .
      dockerfile: Dockerfile.bot
      args:
        BOT_ENTRY: bridge2.py
      additional_contexts:
        source: ${BALE_SOURCE:-./sources/telegram-to-bale}
    volumes:
      - api-data:/var/lib/telegram-bot-api:ro
      - type: bind
        source: ./config/bale.json
        target: /run/bridge/config.json
        read_only: true
        bind:
          create_host_path: false

  dashboard:
    profiles: [all]
    build:
      context: ${DASHBOARD_SOURCE:-./sources/dashbord-bale-rubika}
    restart: unless-stopped
    depends_on: [rubika, bale]
    environment:
      TELEGRAM_API_URL: http://telegram-api:8081
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:${DASHBOARD_CONTAINER_PORT:-8000}"

volumes:
  api-data:
